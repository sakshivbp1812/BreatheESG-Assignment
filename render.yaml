services:
  - type: web
    name: breatheesg-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DEBUG
        value: False

      - key: SECRET_KEY
        value: breatheesg-secret-key

      - key: ALLOWED_HOSTS
        value: "*"